
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realmfall — RPG</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #f5ead7;
      background:
        radial-gradient(ellipse at top, #423323 0%, #191711 48%, #0b0c0d 100%);
      font-family: Georgia, serif;
    }

    .panel {
      width: min(100%, 440px);
      padding: 32px;
      background: #171713;
      border: 1px solid #806b43;
      border-radius: 12px;
      box-shadow: 0 20px 70px #0009;
    }

    h1 {
      margin: 0;
      color: #e7c77f;
      text-align: center;
      letter-spacing: 4px;
      font-size: 30px;
    }

    .subtitle {
      margin: 10px 0 26px;
      color: #b5a98f;
      text-align: center;
      font-size: 14px;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 22px; }

    button, input { font: inherit; }

    .tabs button {
      flex: 1;
      padding: 11px 6px;
      color: #c9bda6;
      background: #25241e;
      border: 1px solid #494333;
      cursor: pointer;
    }

    .tabs button.active {
      color: #ffe4a4;
      border-color: #c7a45e;
      background: #393020;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #e2d5bd;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #4d493c;
      border-radius: 5px;
      color: white;
      background: #0d0e0c;
      outline: none;
    }

    input:focus { border-color: #c7a45e; }

    .submit {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      color: #21190c;
      background: #d7b56d;
      border: 0;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #message {
      min-height: 40px;
      margin: 16px 0 0;
      color: #e8cb91;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #game { text-align: center; }
    #game h2 { color: #e7c77f; }
    .hidden { display: none !important; }

    .note {
      color: #aaa18d;
      font: 12px/1.5 Arial, sans-serif;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <section id="auth">
      <h1>REALMFALL</h1>
      <p class="subtitle">Your legend begins here.</p>

      <div class="tabs">
        <button id="loginTab" class="active" type="button">INLOGGEN</button>
        <button id="signupTab" type="button">ACCOUNT MAKEN</button>
      </div>

      <form id="authForm">
        <div id="usernameField" class="hidden">
          <label for="username">Gebruikersnaam</label>
          <input id="username" minlength="3" maxlength="20"
            pattern="[A-Za-z0-9_-]{3,20}"
            autocomplete="username"
            placeholder="Bijv. ShadowKnight">
          <p class="note">3–20 tekens: letters, cijfers, _ of -</p>
        </div>

        <label for="email">E-mailadres</label>
        <input id="email" type="email" required
          autocomplete="email" placeholder="jij@voorbeeld.nl">

        <label for="password">Wachtwoord</label>
        <input id="password" type="password" required
          minlength="8" autocomplete="current-password"
          placeholder="Minimaal 8 tekens">

        <button id="submit" class="submit" type="submit">
          INLOGGEN
        </button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section id="game" class="hidden">
      <h1>REALMFALL</h1>
      <h2>Welkom, <span id="playerName"></span>!</h2>
      <p>Je account werkt. Jouw avontuur begint binnenkort.</p>
      <p class="note">
        Volgende stap: je 3D-personage en de sociale bar-lobby.
      </p>
      <button id="logout" class="submit" type="button">UITLOGGEN</button>
      <p id="gameMessage" role="status"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://jpfafbpeexjdljebhzzo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vRMUoWgWM_5WOtjysEhWZQ_xni9HEiV";

    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const auth = document.getElementById("auth");
    const game = document.getElementById("game");
    const form = document.getElementById("authForm");
    const message = document.getElementById("message");
    const usernameField = document.getElementById("usernameField");
    const usernameInput = document.getElementById("username");
    const submit = document.getElementById("submit");
    let mode = "login";

    function setMode(nextMode) {
      mode = nextMode;
      const signingUp = mode === "signup";
      usernameField.classList.toggle("hidden", !signingUp);
      usernameInput.required = signingUp;
      document.getElementById("loginTab").classList.toggle("active", !signingUp);
      document.getElementById("signupTab").classList.toggle("active", signingUp);
      submit.textContent = signingUp ? "ACCOUNT AANMAKEN" : "INLOGGEN";
      document.getElementById("password").autocomplete =
        signingUp ? "new-password" : "current-password";
      message.textContent = "";
    }

    document.getElementById("loginTab").onclick = () => setMode("login");
    document.getElementById("signupTab").onclick = () => setMode("signup");

    async function showProfile(user) {
      const { data, error } = await db
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .single();

      if (error) {
        throw new Error("Je bent ingelogd, maar je profiel kon niet worden geladen. Controleer de SQL-trigger en profieltabel.");
      }

      document.getElementById("playerName").textContent = data.username;
      auth.classList.add("hidden");
      game.classList.remove("hidden");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      submit.disabled = true;

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (SUPABASE_URL.includes("VUL_HIER") ||
            SUPABASE_KEY.includes("VUL_HIER")) {
          throw new Error("Vul eerst je Supabase Project URL en Publishable Key in de code in.");
        }

        if (mode === "signup") {
          const username = usernameInput.value.trim();

          if (!/^[A-Za-z0-9_-]{3,20}$/.test(username)) {
            throw new Error("Gebruik 3–20 letters, cijfers, _ of - voor je gebruikersnaam.");
          }

          const { data, error } = await db.auth.signUp({
            email,
            password,
            options: {
              data: { username }
            }
          });

          if (error) throw error;

          if (data.session) {
            await showProfile(data.user);
          } else {
            message.textContent =
              "Account aangemaakt! Controleer je e-mail om je account te bevestigen en log daarna in.";
          }
        } else {
          const { data, error } = await db.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;
          await showProfile(data.user);
        }
      } catch (error) {
        message.textContent = error.message || "Er ging iets mis.";
      } finally {
        submit.disabled = false;
      }
    });

    document.getElementById("logout").addEventListener("click", async () => {
      const button = document.getElementById("logout");
      button.disabled = true;
      const { error } = await db.auth.signOut();
      button.disabled = false;

      if (error) {
        document.getElementById("gameMessage").textContent = error.message;
        return;
      }

      game.classList.add("hidden");
      auth.classList.remove("hidden");
      message.textContent = "Je bent uitgelogd.";
    });

    async function restoreSession() {
      const { data, error } = await db.auth.getSession();
      if (error || !data.session) return;

      try {
        await showProfile(data.session.user);
      } catch (err) {
        message.textContent = err.message;
        auth.classList.remove("hidden");
        game.classList.add("hidden");
      }
    }

    restoreSession();
  </script>
</body>
</html>
